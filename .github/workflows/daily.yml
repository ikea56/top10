name: daily-update

on:
  schedule:
    # 日本時間 月〜金の朝7:00（= UTC の日〜木 22:00）。混雑時は数十分遅れることがあります
    - cron: "0 22 * * 0-4"
  workflow_dispatch:      # 手動実行ボタン用

permissions:
  contents: write         # 結果（docs/・data/）をリポジトリに保存するため

concurrency:
  group: site-update      # 週次バックテストと同時に走らないようにする
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ランキング生成
        run: python -m src.main
      - name: 結果を保存（コミット）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "daily update $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
