name: weekly-backtest

on:
  schedule:
    - cron: "0 18 * * 6"   # 毎週土曜 UTC 18:00 = 日曜 3:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 過去2年の再現検証
        run: python -m src.backtest
      - name: 結果を保存（コミット）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest_summary.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "weekly backtest $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
          
