name: negative-watch

# 信用リスク監視ページ（docs/negative/）の更新。株のランキング（daily-update）とは別の仕組みです。
on:
  schedule:
    # 日本時間 月〜金の 朝7:25（= UTC 日〜木 22:25）と 夕方17:30（= UTC 月〜金 08:30）
    - cron: "25 22 * * 0-4"
    - cron: "30 8 * * 1-5"
  workflow_dispatch:      # 手動実行（Run workflow）

permissions:
  contents: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  negative:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 信用リスク監視ページを生成
        run: python -m src.negative
      - name: 結果を保存（コミット）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "negative watch $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
