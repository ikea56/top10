name: negative-watch

# 信用リスク監視ページ（docs/negative/）の更新。株のランキング（daily-update）とは別の仕組みです。
on:
  schedule:
    # 1日1回。日本時間 月〜金の朝7:30（= UTC 日〜木 22:30）。
    # 前日夕方〜夜の適時開示（決算の多くは15:30以降）と夜間のニュースがそろったあとで、7:10の株ランキングの更新・7:15のドル円の
    # 更新が終わってから動き、取引時間（9:00〜15:30）より前に終わります。月曜の朝は、金曜の夜〜週末の分も15日分に含まれます。
    - cron: "30 22 * * 0-4"
  workflow_dispatch:      # 手動実行（Run workflow）

permissions:
  contents: write

concurrency:
  group: site-update
  cancel-in-progress: false

jobs:
  negative:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 信用リスク監視ページを生成
        run: python -m src.negative
      - name: 結果を保存（コミット）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "negative watch $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
