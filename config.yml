# ============================================================
#  設定ファイル（ここを書き換えるだけで挙動を変えられます）
#  ※ 文字の前後の「:」やインデント（半角スペース）は消さないでください
# ============================================================

site_title: 本日の注目銘柄ランキング
top_n: 10                      # 何銘柄表示するか

# 対象市場（JPXの上場銘柄一覧から自動取得）
markets: [プライム, スタンダード, グロース]

# ---- 株価データ取得 ----
data:
  period: 2y                   # 取得期間（52週高値や75日線の計算に必要）
  chunk_size: 150              # 一度に取得する銘柄数（多すぎるとエラーになりやすい）
  sleep_between_chunks: 1.5    # 取得の合間の待ち時間（秒）
  min_success_ratio: 0.5       # 取得できた銘柄がこの割合未満なら「失敗」とみなして更新を止める

# ---- 除外条件 ----
filters:
  min_price: 100               # 株価100円未満は除外（極端な低位株）
  min_turnover_yen: 100000000  # 売買代金（直近20日平均）1億円未満は除外
  exclude_codes_file: data/exclude_codes.txt   # 手動で除外したい銘柄コード（監理銘柄など）
  exclude_name_keywords: ["監理", "整理"]       # 銘柄名にこの文字があれば除外

# ---- 業績データ（yfinance）----
fundamentals:
  min_fetch: 40                # 最低でもテクニカル上位この数だけは業績を取得
  max_fetch: 250               # 取得数の上限（取得しすぎるとYahooに制限されます）
  sleep: 0.4                   # 1銘柄ごとの待ち時間（秒）
  cache_days: 7                # 取得済みの業績を再利用する日数
  exclude_loss_making: true    # 赤字企業（営業利益TTMが0以下）を除外
  exclude_if_missing: false    # 業績が取れない銘柄を除外するか（銀行・保険などは取れないことがあります）

# ---- スコア配点（元の仕様どおり）----
# ※ 出来高・高値・業績などは「段階の高い方だけ」加点されます（重複加点なし）
scoring:
  high60: 30                   # 60日高値更新
  high30: 15                   # 30日高値更新（60日高値更新の場合は加算されません）
  vol_ratio:                   # [倍率, 点数]  当日出来高 ÷ 20日平均出来高
    - [2.0, 20]
    - [3.0, 30]
  trend: 20                    # 株価 > 25日線 かつ 25日線 > 75日線
  op_growth:                   # [前年比, 点数]  営業利益の前年比
    - [0.20, 15]
    - [0.50, 25]
  turnaround_points: 15        # 赤字→黒字転換のときの点数
  mcap:                        # [時価総額(円), 点数]
    - [10000000000, 5]         # 100億円
    - [50000000000, 10]        # 500億円
  normalize_to: 100            # 配点の合計(115点)を100点満点に換算して表示

# ---- 強気判定（換算後スコアで判定）----
bull:
  strong: 70                   # この点以上で「強気」
  mild: 50                     # この点以上で「やや強気」、未満は「中立」
overheat:                      # 過熱とみなす基準（該当すると「強気」を「やや強気」に格下げ）
  rsi: 80
  ma25_gap: 0.25               # 25日線からの乖離率 25%

# ---- バックテスト ----
backtest:
  replay_years: 2              # 過去何年を再現検証するか
  step_days: 5                 # 何営業日ごとにランキングを作るか（5=毎週）
  cost_pct: 0.2                # 売買コスト（往復・％）
  horizons: {1w: 5, 1m: 21, 3m: 63}   # 保有期間（営業日）
  min_forward_samples: 15      # 実運用記録がこの回数未満なら「データ蓄積中」と表示
