# ============================================================
#  設定ファイル（点数配分・出来高倍率・最低売買代金・高値更新期間・除外条件はすべてここで管理）
#  ※ 「:」やインデント（半角スペース）は消さないでください。数字は 1e10 ではなく 10000000000 と書きます
#  ※ 配点の合計は起動時に自動チェックされ、weights と合わないとエラーで止まります
# ============================================================

site_title: 本日の注目銘柄ランキング
top_n: 10                      # 何銘柄表示するか（総合点の高い順）

markets: [プライム, スタンダード, グロース]

# ---- 株価データ取得 ----
data:
  period: 2y                   # 取得期間（252日高値の計算に1年超が必要）
  chunk_size: 150
  sleep_between_chunks: 1.5
  min_success_ratio: 0.5       # 取得できた銘柄がこの割合未満なら更新を止める

# ---- 除外条件（ランキングから除外）----
filters:
  min_price: 100                       # 極端な低位株：株価がこの円未満は除外
  min_turnover_yen: 100000000          # 売買代金不足：20日平均売買代金がこの円未満は除外
  min_avg_volume: 50000                # 出来高不足：20日平均出来高がこの株数未満は除外
  min_today_volume: 10000              # 出来高不足：当日出来高がこの株数未満は除外
  tob_price_lock:                      # TOB疑い（価格固着）：TDnetが確認できない場合の保険
    enabled: true
    jump: 0.20                         # 直近lookback日に1日で+20%以上のギャップがあり
    lookback: 60
    range10: 0.015                     # 直近10日の値幅が1.5%以内に固着している銘柄
  exclude_codes_file: data/exclude_codes.txt   # 手動で除外したい銘柄コード
  exclude_name_keywords: ["監理", "整理"]       # 銘柄名にこの文字があれば除外
  exclude_supervision: true            # JPX公式「監理・整理銘柄一覧」を取得して除外
  supervision_urls: ["https://www.jpx.co.jp/listing/market-alerts/supervision/01.html"]

# ---- 業績データ（yfinance）----
fundamentals:
  min_fetch: 60                # 最低でもこの数だけは業績を取得
  max_fetch: 200               # 取得数の上限（取得しすぎるとYahooに制限されます）
  survivor_target: 80          # 赤字除外後にこの数の候補が残れば取得を打ち切る（TDnet解析の対象数＋予備）
  sleep: 0.3
  cache_days: 7
  exclude_loss_making: true    # 赤字企業（直近12か月の営業利益が0以下）を除外
  exclude_chronic_loss: true   # 継続赤字企業（通期の営業利益が連続で赤字）を除外
  chronic_loss_years: 2        # 何期連続の赤字を「継続赤字」とするか
  allow_forecast_turnaround: true   # 今期黒字予想がある赤字企業（継続赤字を除く）は黒字転換候補として残す
  exclude_if_missing: false    # 業績が取れない銘柄を除外するか（銀行・保険などは取れないことがあります）

# ---- 基本スコア（合計100点）----
weights: {trend: 50, demand: 25, earnings: 15, market: 10}

scoring:
  trend:                       # トレンド評価（モメンタム＝高値更新を優遇）
    windows: {short: 20, mid: 60, long: 252}    # 高値更新の判定期間（営業日）
    near_high_ratio: 0.97      # 52週高値接近：252日高値の97%以上
    high:                      # 高値更新（一番高い段階だけ加点）
      new252: 22               # 252日高値更新（最も大きく加点）
      new60: 15
      near52w: 12
      new20: 8
    ma_alignment: 15           # 株価 > 25日線 > 75日線
    ma_partial: 7              # 株価 > 25日線 のみ
    macd: 4                    # MACD > シグナル かつ MACD > 0
    rsi: {points: 4, low: 50, high: 75}   # RSIが適温ゾーン（過熱を除く）
    rel_strength: 5            # 20日騰落率がTOPIXを上回る
  demand:                      # 需給評価
    vol_ratio: [[1.5, 6], [2.0, 12], [3.0, 18]]   # [倍率, 点数] 当日出来高 ÷ 前日までの20日平均
    up_day_volume: {min_ratio: 1.5, points: 3}    # 上昇日に出来高が増えている
    liquidity: {min_turnover_yen: 500000000, points: 4}   # 売買代金が十分
  earnings:                    # 業績評価
    op_growth: [[0.20, 8], [0.50, 12]]            # 営業利益の前年比
    mcap: [[10000000000, 1], [50000000000, 3]]    # 時価総額
  market:                      # 地合い評価
    regime: {good: 6, neutral: 3, bad: 0}         # TOPIXの状態
    sector: {top: 4, mid: 2, bottom: 0}           # 業種の勢い（20日騰落率の順位）
    sector_min_members: 5

# ---- 相場環境の判定（🟢買い優勢 / 🟡中立 / 🔴防御優先）。個別銘柄ではなく市場全体の状態 ----
stance:
  ma_mid: 75                   # 中期線（TOPIX・日経平均・グロース）
  ma_long: 200                 # 長期線（TOPIX）
  growth_ticker: "2516.T"      # 東証グロース市場250連動ETF（指数そのものは無料データに無いため）

# ---- 寄り付き前の指標（先物・為替・米国株）。相場判定と「ギャップダウン注意」にだけ使い、個別銘柄の順位は変えません ----
premarket:
  enabled: true
  max_age_hours: 14            # 最後の値がこれより古い指標は「古い」として判定に使わない
  gap_down: -1.5               # 先物（日経225・TOPIX）が東証の前日引けからこの%以下 → 「ギャップダウンリスクあり」
  downgrade_score: -0.35       # 加重平均の評価点（−1〜+1）がこれ以下なら、相場判定を一段階弱める
  indicators:                  # weight：先物は3、その他は1（先物を重視）。weak/strong：変化率（%）の境目
    - {key: n225f,  label: 日経225先物, ticker: "NIY=F",  mode: tokyo_close, weight: 3, weak: -1.0, strong: 0.5, futures: true, note: "CME・円建て"}
    - {key: topixf, label: TOPIX先物,   ticker: "TPY=F",  mode: tokyo_close, weight: 3, weak: -1.0, strong: 0.5, futures: true, note: "CME・円建て（取引が少なく取得できない日があります）"}
    - {key: usdjpy, label: ドル円,      ticker: "JPY=X",  mode: tokyo_close, weight: 1, weak: -1.0, strong: 0.7, note: "円高が弱材料"}
    - {key: sp500,  label: S&P500,      ticker: "^GSPC",  mode: daily,       weight: 1, weak: -1.5, strong: 0.7}
    - {key: nasdaq, label: NASDAQ,      ticker: "^IXIC",  mode: daily,       weight: 1, weak: -2.0, strong: 1.0}
    - {key: sox,    label: SOX指数,     ticker: "^SOX",   mode: daily,       weight: 1, weak: -3.0, strong: 1.5}

# ---- 業種別リード指標（外部環境）。直近で終了した米国市場・為替・商品などの動きから、業種ごとの追い風・逆風を ±5点で評価 ----
# 企業の本質的な評価（押し目・業績・増配・自社株買い）が主役です。この点数は最後の微調整で、順位への反映は rank_effect 倍までです。
# 業種ごとの参照先はここで自由に変更・追加できます（groups の上から順に、最初に合致したグループを使います）。
lead:
  enabled: true
  max_points: 5                # 業種リードスコアの範囲（−5〜+5）
  rank_effect: 0.5             # 総合点に足す割合（0.5なら最大±2.5点）。0にすると表示だけで順位は変えません
  max_rank_shift: 3            # 業種リードで動く順位の上限（押し目・業績・開示だけで並べた順位から、上下この順位まで）
  verdict_points: 1.5          # 画面の「追い風／逆風」の判定に使う点数の境目（±この点以上）
  flat_band: 0.25              # 追い風・逆風とみなす強さの境目（0〜1）。これ未満は「横ばい」
  max_age_days: 6              # 最後の値がこれより古い参照先は使わない（休日をまたぐ余裕）
  # refs の項目：ticker（Yahoo）/ label / weight（重み）/ full（この変化率%で最大評価）/ invert（Trueなら上昇が逆風）
  #            / kind（pct＝変化率、diff＝差分。金利のように%でなく差で見るもの）/ mode（daily＝直近の取引日の前日比、tokyo_close＝東証の前日引けから）
  groups:
    - key: semiconductor
      label: 半導体
      codes: ["8035", "6857", "6146", "6920", "7735", "6723", "6963", "3436", "6525", "4063", "7741"]  # 東エレク・アドバンテスト・ディスコ・レーザーテック・SCREEN・ルネサス・ローム・SUMCO・KOKUSAI・信越化学・HOYA（コードで指定）
      refs:
        - {ticker: "^SOX",  label: SOX指数,  weight: 2, full: 3.0}
        - {ticker: "MU",    label: Micron,   weight: 1, full: 5.0}
        - {ticker: "NVDA",  label: NVIDIA,   weight: 1, full: 5.0}
        - {ticker: "AMD",   label: AMD,      weight: 1, full: 5.0}
    - key: electronics
      label: 電機・精密・機械
      sectors: [電気機器, 精密機器, 機械]
      refs:
        - {ticker: "^SOX",  label: SOX指数,  weight: 1, full: 3.0}
        - {ticker: "^IXIC", label: NASDAQ,   weight: 1, full: 2.0}
        - {ticker: "JPY=X", label: ドル円,    weight: 1, full: 1.0, mode: tokyo_close}
    - key: auto
      label: 自動車
      sectors: [輸送用機器]
      refs:
        - {ticker: "TSLA",  label: Tesla,    weight: 1, full: 5.0}
        - {ticker: "GM",    label: GM,       weight: 1, full: 3.0}
        - {ticker: "F",     label: Ford,     weight: 1, full: 3.0}
        - {ticker: "JPY=X", label: ドル円,    weight: 2, full: 1.0, mode: tokyo_close}
    - key: bank
      label: 銀行
      sectors: [銀行業]
      refs:
        - {ticker: "^TNX",  label: 米10年債利回り, weight: 2, full: 0.10, kind: diff}
        - {ticker: "XLF",   label: XLF（米金融）,   weight: 1, full: 2.0}
    - key: finance
      label: 保険・証券・その他金融
      sectors: [保険業, 証券、商品先物取引業, その他金融業]
      refs:
        - {ticker: "XLF",   label: XLF（米金融）,   weight: 1, full: 2.0}
        - {ticker: "^TNX",  label: 米10年債利回り, weight: 1, full: 0.10, kind: diff}
    - key: resources
      label: 資源
      sectors: [鉱業, 石油・石炭製品]
      refs:
        - {ticker: "CL=F",  label: WTI原油,   weight: 1, full: 3.0}
        - {ticker: "BZ=F",  label: Brent原油, weight: 1, full: 3.0}
    - key: utility
      label: 電力・ガス
      sectors: [電気・ガス業]
      refs:
        - {ticker: "CL=F",  label: WTI原油（燃料コスト）, weight: 1, full: 3.0, invert: true}
    - key: metals
      label: 鉄鋼・非鉄
      sectors: [鉄鋼, 非鉄金属, 金属製品]
      refs:
        - {ticker: "HG=F",  label: 銅,       weight: 2, full: 2.5}
        - {ticker: "^GSPC", label: S&P500,   weight: 1, full: 1.5}
    - key: tech_service
      label: 情報・ソフトウェア
      sectors: [情報・通信業, サービス業]
      refs:
        - {ticker: "^IXIC", label: NASDAQ,   weight: 1, full: 2.0}
        - {ticker: "IGV",   label: IGV（米ソフトウェア）, weight: 1, full: 2.5}
    - key: pharma
      label: 医薬品
      sectors: [医薬品]
      refs:
        - {ticker: "XLV",   label: XLV（米ヘルスケア）, weight: 1, full: 1.5}
    - key: realestate
      label: 不動産・建設
      sectors: [不動産業, 建設業]
      refs:
        - {ticker: "^TNX",  label: 米10年債利回り, weight: 2, full: 0.10, kind: diff, invert: true}
        - {ticker: "VNQ",   label: VNQ（米不動産）,  weight: 1, full: 2.0}
    - key: chemical
      label: 化学
      sectors: [化学]
      refs:
        - {ticker: "^GSPC", label: S&P500,   weight: 1, full: 1.5}
        - {ticker: "CL=F",  label: WTI原油,   weight: 1, full: 3.0}

# ---- 評価イベント（基本点に上乗せ。業績イベント＋株主還元＋同時発生ボーナス）----
events:
  cap: 30                      # イベント点の上限
  earnings:
    turnaround: 10             # 黒字転換（前期赤字→今期黒字予想）
    turnaround_actual: 8       # 黒字転換（予想が無く、直近12か月の実績で判定）
    sustained_profit: 4        # 継続黒字化（来期も黒字予想）
    record_high: 5             # 最高益更新
    upward_revision: 4         # 上方修正
    revision_min_change: 0.03  # 予想EPSが30日前より3%以上上方修正
  shareholder:
    dividend_increase: 2       # 増配
    increase_tiers: [[0.10, 4], [0.20, 6], [0.30, 8]]   # 大幅増配（増配率→点数）
    streak_tiers: [[3, 2], [5, 4], [10, 6]]             # 連続増配（年数→点数）
    payout_improve: 2          # 配当性向の改善（取得できる場合のみ）
    payout_max: 0.70           # 配当性向がこの値を超える場合は加点しない
    buyback: 3                 # 自社株買い（取得できる場合のみ）
    buyback_min_ratio: 0.003   # 時価総額比0.3%以上
  momentum_bonus: {2: 3, 3: 10, 4: 15}   # 252日高値更新 ＋ {増配, 黒字転換, 最高益} の同時発生数 → ボーナス点

# ---- 期待値点 = 総合点 × (過去勝率 ÷ 基準勝率) × 流動性係数 ----
expected_score:
  win_rate_baseline: 0.5       # この勝率なら係数1.0（総合点と同じ尺度にそろえる）
  default_win_rate: 0.5        # バックテスト結果が未取得／サンプル不足のときに使う勝率
  winrate_horizon: 1m
  winrate_years: 5             # 勝率の集計に使う直近年数
  bands: [0, 40, 55, 70, 85, 101]   # テクニカル点（100点換算）のスコア帯
  min_samples: 200
  liquidity_factor: [[0, 0.70], [300000000, 0.85], [1000000000, 0.95], [5000000000, 1.00]]  # [20日平均売買代金, 係数]

# ---- 強気判定（総合点で判定）----
bull:
  strong: 75
  mild: 55
overheat:
  rsi: 80
  ma25_gap: 0.25

# ---- バックテスト ----
backtest:
  replay_years: 10             # 取得・再現する年数（1/3/5/10年の成績を出すには10）。重ければ5に
  periods: [1, 3, 5, 10]       # 成績を出す期間（年）
  table_years: 5               # 画面の「1週間/1か月/3か月後」表に使う期間
  step_days: 5                 # 何営業日ごとにランキングを作るか（5=毎週）
  cost_pct: 0.2                # 売買コスト（往復・％）
  horizons: {1w: 5, 1m: 20, 3m: 60}   # 保有期間（営業日）
  equity_horizon: 1m           # 資産曲線（DD・シャープ・年率）に使う保有期間
  min_forward_samples: 15

# ============================================================
#  有効性の検証（週次バックテストで自動実行。点数が高いほど成績が良いか、各要素に意味があるか、など）
# ============================================================
validation:
  horizon: 1m                  # 主に評価する保有期間（backtest.horizons のキー）
  band_edges: [0, 30, 40, 50, 60, 70, 80, 101]   # 点数帯（押し目スコアの技術部分を100点換算）
  quantiles: 5                 # 点数順の分位（5＝五分位）
  oos_years: 3                 # 直近この年数を「検証期間（設計時に使っていない扱い）」として別集計
  bootstrap: 2000              # 信頼区間のためのリサンプリング回数
  min_obs: 50                  # 1つの区分の最低データ数（足りなければ「—」）
  verdict:                     # 判定の基準（t値＝平均÷標準誤差。2以上で偶然とは言いにくい目安）
    t_good: 2.0
    t_weak: 1.0
    positive_year_good: 0.7
    positive_year_weak: 0.5

# ============================================================
#  押し目ランキング（メイン）  ※ 従来の「今強い銘柄」スコアは補助指標として残しています
# ============================================================
pullback:
  weights: {trend: 15, drawdown: 20, ma50: 12, volume: 8, rs: 10, bounce: 5, quality: 20, market: 10}   # 合計100
  # ↓ 各項目は「段階」ではなく折れ線（[値, 点数] を直線でつなぐ）で連続的に採点します。同じ満点の銘柄が並びにくくなります。
  trend:                       # 長期上昇トレンド（合計15点）
    ma50_over_200: {max: 10, curve: [[0.0, 0], [0.02, 4], [0.05, 8], [0.10, 10]]}   # 50日線が200日線を何%上回るか
    above_ma200: 3                                                                    # 株価が200日線の上
    ma200_rising: {max: 2, curve: [[0.0, 0], [0.02, 2]]}                              # 200日線の20日間の上昇率
  drawdown_curve:              # 52週高値（終値ベース）からの調整率 → 点数（最大20）。-10%を頂点に、浅すぎ・深すぎは下がる
    [[-0.30, 0], [-0.25, 3], [-0.20, 8], [-0.15, 16], [-0.10, 20], [-0.05, 16], [-0.03, 10], [0.0, 3]]
  ma50_gap_curve:              # 50日線との乖離 → 点数（最大12）。50日線にちょうど接した位置が頂点
    [[-0.10, 0], [-0.08, 2], [-0.06, 6], [-0.03, 10], [0.0, 12], [0.02, 11], [0.04, 9], [0.07, 6], [0.10, 2], [0.15, 0]]
  volume:                      # 出来高の収縮（直近10日平均 ÷ 50日平均）→ 点数（最大8）。調整局面（高値から-3%以下）のみ評価
    curve: [[0.70, 8], [0.85, 5.6], [1.00, 2.4], [1.15, 0]]
    pullback_gate: -0.03
    status_ratio: 0.85         # 画面の「出来高縮小」表示の基準
  rs:                          # 相対力：直近60日の騰落率 − TOPIXの騰落率 → 点数（最大10）。市場より強かった銘柄の押し目を優先
    curve: [[-0.10, 0], [-0.03, 3], [0.0, 5], [0.05, 8], [0.12, 10]]
  bounce:                      # 反発確認（最大5）：調整局面で、短期の下げ止まりが見えるか
    above_ma5: 2.5             # 株価が5日線の上
    ret3d_curve: [[-0.03, 0], [0.0, 1.0], [0.02, 2.5]]   # 直近3日の騰落率
  quality:                     # 業績・株主還元の維持（合計は weights.quality を上限）
    profit_ok: 4               # 直近12か月が黒字で減益でない
    turnaround: 5
    record_high: 5
    dividend: 4
    streak: 3
    buyback: 3
    sustained: 2
    revision: 3
  market:                      # 地合い：-15〜+10点。良い時は加点、悪い時は減点して順位全体へ反映
    topix: {good: 6, neutral: 3, bad: 0}
    nikkei: {above_ma50: 4, below: 0}
    topix_below_ma75: -10      # TOPIXが75日線の下
    topix_below_ma200: -5      # TOPIXが200日線の下（上と重ねて減点）
    nikkei_below_ma50: -3      # 日経平均が50日線の下
    growth_below_ma75: -3      # 東証グロース250（ETF 2516）が75日線の下。取得できない場合は適用しない
    floor: -15                 # 合計の下限（上限は weights.market の10点）
  penalties:                   # 減点（すでに急騰した銘柄を優遇しない）
    surge_5d: {ret: 0.12, pts: 10}            # 直近5日で+12%以上
    surge_20d: {ret: 0.25, pts: 15}           # 直近20日で+25%以上
    far_from_high: {dd: -0.25, pts: 15}       # 高値から-25%以上離れている
    volume_spike: {vol_ratio: 3.0, ret1d: 0.04, pts: 10}   # 出来高急騰だけで上がった日
    volume_expansion: {ratio: 1.5, pts: 6}    # 調整中なのに出来高が膨らんでいる
  earnings_penalty:            # 決算直前はギャップ（寄り付きの窓開け）リスクが高いため総合点から減点
    - {business_days: 3, pts: 10}     # 決算まで3営業日以内
    - {business_days: 5, pts: 5}      # 決算まで5営業日以内
  atr:                         # 撤退ライン＝移動平均線 − ATR×倍率
    period: 14
    multiplier: 1.0
    fallback_multiplier: 2.0   # 株価が50日線・200日線の下にあるとき：現在値 − ATR×この倍率
  labels: {good: 70, fair: 50}                # 押し目良好 / 押し目候補 / 様子見
  caution:
    earnings_days: 10          # 決算発表がこの日数以内なら「決算接近」
    vol_ratio: 1.5             # 20日ボラティリティ ÷ 60日ボラティリティ

# ============================================================
#  TDnet（適時開示）解析：押し目スコア上位だけ。全銘柄には実施しません
# ============================================================
tdnet:
  enabled: true
  provider: yanoshin           # yanoshin（外部の無料API・過去180日以上を銘柄別に取得）
  base_url: "https://webapi.yanoshin.jp/webapi/tdnet/list/{code}.json"
  lookback_days: 180
  top_k: 50                    # 解析する銘柄数（押し目スコアの上位）
  max_check: 80                # 除外で繰り上げた分を含め、解析する最大数
  sleep: 0.5
  timeout: 20
  retries: 2
  cache_hours: 18
  on_error: warn               # warn＝確認できない銘柄は残して「TDnet未確認」と表示 / exclude＝除外
  parse_pdf: true              # 「業績予想の修正」の増額・減額をPDFから判定（直近30日分のみ取得可）
  pdf_max_age_days: 30
  points:                      # Event Score（TDnetの開示ごとに1回だけ加点）
    upward_revision: 6
    dividend_increase: 5
    buyback: 5
    large_order: 4
    alliance: 3
    new_product: 2
    capex: 3
    factory: 3
    stock_split: 2
    downward_revision: -10
    dividend_cut: -10
    unknown_revision: -3       # 方向を判定できない「業績予想の修正」
  cap: {plus: 20, minus: 30}
  freshness:                   # イベントの鮮度：開示から [この日数以内, 評価割合]。180日より前は0%
    - [30, 1.0]
    - [90, 0.7]
    - [180, 0.4]
  downward_recent: {days: 30, penalty: 15}   # 直近30日以内の下方修正：総合点から-15、判定は「様子見」
  downward_demote_dividend_cut_days: 90      # 減配で「様子見」に下げる期間
  buyback_tiers:               # 自社株買い：時価総額比 [この比率以上, 点数]。比率が不明なら buyback_unknown
    - [0.03, 5]
    - [0.01, 3]
    - [0.0, 1]
  buyback_unknown: 1

# ============================================================
#  保有銘柄の監視（㉒）。保有銘柄の保存先は Google スプレッドシート＋Apps Script（README参照）
# ============================================================
holdings:
  endpoint: "https://script.google.com/macros/s/AKfycbzjG548aNKEbuxKhw784JmIlhL8q8KwvxMiKgoQVo5fRyRrPVaS7HRSD8xXPv1Ll0PXfQ/exec"                 # Apps Script の「ウェブアプリ」URL（https://script.google.com/macros/s/.../exec）。空なら機能オフ
  max_holdings: 50
  earnings_watch_days: 10      # 決算までこの日数以内なら「要監視」
  down_watch_days: 90          # 下方修正から31〜90日は「要監視」（30日以内は「売却検討」）
  dividend_cut_days: 90        # 減配の開示がこの日数以内なら「売却検討」
  collapse_dd: -0.25           # 52週高値から-25%以上下落したら「押し目崩れ」
  pbkdf2_iterations: 200000    # 監視データの暗号化（合言葉から鍵を作る回数）

# 前回ランキングとの比較（急上昇・急下降）
movers:
  save_top: 30                 # 毎日の記録に残す順位の数
  show_top: 10                 # 「新規ランクイン/ランクアウト」の基準（表示している上位N）
  jump: 5                      # この順位以上の上昇・下降を「急上昇／急下降」とする
  limit: 5                     # 各欄の表示件数
